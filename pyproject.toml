[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dataops-control-plane"
version = "0.1.0"
description = "Provider-neutral DataOps control plane for pipeline incident analysis and recovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=9.4.1,<9.5",
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlmodel>=0.0.22,<0.1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.fastapi]
entrypoint = "dataops_control_plane.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dataops_control_plane"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FAST"]

[tool.coverage.run]
branch = true
source = ["dataops_control_plane"]

[tool.coverage.report]
show_missing = true
skip_covered = true
