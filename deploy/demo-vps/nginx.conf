server {
    listen 80;
    listen [::]:80;
    server_name dataops-console.andyanh.id.vn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dataops-console.andyanh.id.vn;

    ssl_certificate /etc/letsencrypt/live/dataops-console.andyanh.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dataops-console.andyanh.id.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://192.168.1.53:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
